<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by --base-href at build time (/balloons/ for GitHub Pages). -->
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Luke Morse: balloon letters you can play">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#c2e0ff">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">
  <title>Luke Morse</title>

  <script>
    // Light/dark theme: the system's by default; tapping the sun/moon flips
    // it. A choice that differs from the system is remembered; flipping back
    // to match the system forgets it (so it follows the system again).
    // Sets <html data-theme> before first paint; Flutter reads it through
    // window.balloonTheme (lib/audio/js_bridge.dart).
    (() => {
      const KEY = 'theme', mq = matchMedia('(prefers-color-scheme: dark)');
      const system = () => (mq.matches ? 'dark' : 'light');
      let saved = null;
      try { saved = localStorage.getItem(KEY); } catch {}
      if (saved !== 'dark' && saved !== 'light') saved = null;
      const current = () => saved || system();
      const listeners = [];
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      const apply = () => {
        const t = current();
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', t === 'dark' ? '#000000' : '#c2e0ff');
        document.getElementById('sky-toggle')
          ?.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        for (const f of listeners) f(t === 'dark', !reduce.matches);
      };
      mq.addEventListener?.('change', () => { if (!saved) apply(); });
      window.balloonTheme = {
        isDark: () => current() === 'dark',
        onChange: (f) => { listeners.push(f); },
        toggle: () => {
          const next = current() === 'dark' ? 'light' : 'dark';
          saved = next === system() ? null : next;
          try { saved ? localStorage.setItem(KEY, saved) : localStorage.removeItem(KEY); } catch {}
          apply();
        },
        apply,
        // Which balloon set is showing (lib/stage.dart); picks the letter colors below.
        setWild: (wild) => { document.documentElement.dataset.set = wild ? 'wild' : 'classic'; },
      };
      apply();
    })();
  </script>

  <style>
    /* Theme comes from <html data-theme>, set by the script above. The colors
       are registered so they can fade when it flips; KEEP IN SYNC with
       Night.duration / Night.curve (lib/night.dart), which fades the Flutter
       side (clouds, strings) alongside. */
    @property --bg { syntax: "<color>"; inherits: true; initial-value: #c2e0ff; }
    @property --ink { syntax: "<color>"; inherits: true; initial-value: #3a2f2a; }
    @property --card { syntax: "<color>"; inherits: true; initial-value: #fffaf3; }
    @property --cloud { syntax: "<color>"; inherits: true; initial-value: #ffffff; }
    :root { transition: --bg .6s ease, --ink .6s ease, --card .6s ease, --cloud .6s ease; }
    :root { --bg: #c2e0ff; --ink: #3a2f2a; color-scheme: light; }
    :root[data-theme="dark"] { --bg: #000000; --ink: #f2e8dc; color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }

    /* Subtle sun (light) or moon (dark) tucked into the top-right corner
       (centred on it, so only its lower-left quarter shows), behind the
       (transparent) Flutter canvas. They cross-fade and slide into the
       corner when the theme flips. Sun rays: a conic stripe pattern faded out
       radially, slowly turning; the disc and glow breathe a little. */
    .sky {
      position: fixed; z-index: 0; pointer-events: none;
      top: calc(env(safe-area-inset-top) - 110px); right: calc(env(safe-area-inset-right) - 110px);
      width: 220px; height: 220px;
      transition: opacity .6s ease, transform .6s cubic-bezier(.3, 1.4, .5, 1), scale .25s cubic-bezier(.3, 1.6, .5, 1);
    }
    :root[data-theme="dark"] #sun, :root:not([data-theme="dark"]) #moon {
      opacity: 0; transform: translate(40px, -40px);
    }
    /* Tap target over the visible quarter of the disc, above the Flutter
       canvas (which would otherwise take the tap). */
    #sky-toggle {
      position: fixed; z-index: 2;
      top: calc(env(safe-area-inset-top) - 50px); right: calc(env(safe-area-inset-right) - 50px);
      width: 100px; height: 100px; padding: 0; border: 0; border-radius: 50%;
      background: transparent; cursor: pointer;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    #sky-toggle:focus-visible { outline: 2px dashed var(--ink); outline-offset: -8px; }
    #sky-toggle:hover ~ .sky { scale: 1.08; }
    #sky-toggle:active ~ .sky { scale: .94; }
    #sun::before, #sun::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
    #sun::before {
      background: repeating-conic-gradient(from 0deg,
        rgba(255, 244, 190, .3) 0deg 6deg, rgba(255, 244, 190, 0) 8deg 30deg);
      -webkit-mask: radial-gradient(circle, transparent 0 40px, #000 46px, rgba(0,0,0,.4) 75px, transparent 110px);
      mask: radial-gradient(circle, transparent 0 40px, #000 46px, rgba(0,0,0,.4) 75px, transparent 110px);
      animation: sun-spin 90s linear infinite;
    }
    #sun::after {
      background: radial-gradient(circle,
        rgba(255, 251, 232, .75) 0 36px, rgba(255, 238, 170, .25) 38px, rgba(255, 238, 170, .08) 60px, rgba(255, 238, 170, 0) 95px);
      animation: sun-breathe 6s ease-in-out infinite;
    }
    @keyframes sun-spin { to { transform: rotate(360deg); } }
    @keyframes sun-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    /* Moon: a pale disc (radius 36, same as the sun's) with a few craters in
       its visible lower-left quarter, shaded along that edge, and a soft halo
       that breathes. */
    #moon::before, #moon::after { content: ""; position: absolute; border-radius: 50%; }
    #moon::before {
      inset: 0;
      background: radial-gradient(circle,
        rgba(236, 231, 214, 0) 0 34px, rgba(236, 231, 214, .14) 37px, rgba(236, 231, 214, .05) 60px, rgba(236, 231, 214, 0) 95px);
      animation: sun-breathe 6s ease-in-out infinite;
    }
    #moon::after {
      inset: 74px; /* 220/2 - 36 */
      background:
        radial-gradient(circle at 15px 49px, rgba(150, 142, 122, .5) 0 6px, rgba(150, 142, 122, 0) 7px),
        radial-gradient(circle at 28px 62px, rgba(150, 142, 122, .45) 0 3.5px, rgba(150, 142, 122, 0) 4.5px),
        radial-gradient(circle at 27px 44px, rgba(150, 142, 122, .4) 0 2.5px, rgba(150, 142, 122, 0) 3.5px),
        radial-gradient(circle at 8px 60px, rgba(150, 142, 122, .35) 0 2px, rgba(150, 142, 122, 0) 3px),
        rgba(236, 231, 214, .82);
      box-shadow: inset 7px -7px 12px -4px rgba(0, 0, 0, .35), 0 0 14px rgba(236, 231, 214, .25);
    }
    body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    #stage {
      position: fixed; inset: 0;
      touch-action: none; /* no page scroll or pinch-zoom while playing */
      -webkit-tap-highlight-color: transparent;
    }

    /* Static stand-in for the Flutter cloud footer (lib/paint/footer_painter.dart
       at t = 0), shown while the engine loads; removed on Flutter's first frame.
       KEEP IN SYNC with Dart: the 110px height (BalloonStage.footerHeight),
       H and the two row() calls below (FooterPainter.paint), and the colors
       --cloud-back / --cloud (FooterPainter._back / frontColor). */
    #footer-placeholder {
      position: fixed; left: 0; right: 0; bottom: 0; height: 110px;
      pointer-events: none; overflow: hidden;
      --cloud-back: #eaf5ff;
    }
    :root[data-theme="dark"] #footer-placeholder { --cloud-back: #15120f; }
    #footer-placeholder svg { display: block; width: 100%; height: 100%; }

    /* Info button + card, over the footer's left slot (the footer itself is
       Flutter: lib/stage.dart, footerHeight 110). */
    /* Letter colors, for the cute bits: each letter's first gradient color,
       per theme and set, the same one the footer and swap balloon use.
       KEEP IN SYNC with BalloonPalette.day / .night (lib/paint/palette.dart).
       <html data-set> comes from Flutter (balloonTheme.setWild). */
    :root { --l: #E53935; --u: #3F51B5; --k: #43A047; --e: #3D7BFF; --card: #fffaf3; --cloud: #ffffff; }
    :root[data-set="wild"] { --l: #00D9A6; --u: #7ED957; --k: #B04FFF; --e: #FF4FA3; }
    :root[data-theme="dark"] { --l: #F0544F; --u: #6474D6; --k: #5DB861; --e: #5B8DFF; --card: #1c1714; --cloud: #221d19; }
    :root[data-theme="dark"][data-set="wild"] { --l: #2ECDA5; --u: #86D06A; --k: #B672F5; --e: #F06AAE; }
    /* Each letter's second gradient color (only L and E are used, for the
       icon hovers). Same KEEP IN SYNC as above. */
    :root { --l2: #FF9800; --e2: #8E44E8; }
    :root[data-set="wild"] { --l2: #FFE03B; --e2: #FFC233; }
    :root[data-theme="dark"] { --l2: #F5A23A; --e2: #A066F0; }
    :root[data-theme="dark"][data-set="wild"] { --l2: #F2DA5C; --e2: #F2C35A; }
    /* Text-safe versions (-t): the same hue with OKLCH lightness capped at
       .52, which keeps at least 4.5:1 against the light card and against
       white text on top. Without relative colors, fall back to the day ink. */
    :root { --l-t: #3a2f2a; --u-t: #3a2f2a; --k-t: #3a2f2a; --e-t: #3a2f2a; --l2-t: #3a2f2a; --e2-t: #3a2f2a; }
    @supports (color: oklch(from red l c h)) {
      :root {
        --l-t: oklch(from var(--l) min(l, .52) c h); --u-t: oklch(from var(--u) min(l, .52) c h);
        --k-t: oklch(from var(--k) min(l, .52) c h); --e-t: oklch(from var(--e) min(l, .52) c h);
        --l2-t: oklch(from var(--l2) min(l, .52) c h); --e2-t: oklch(from var(--e2) min(l, .52) c h);
      }
    }
    /* Display versions (-d) for the big "Hello!": capped at .62 instead, about
       3:1 (enough for big decorative letters) and less muddy than -t. */
    :root { --l-d: var(--l-t); --u-d: var(--u-t); --k-d: var(--k-t); --e-d: var(--e-t); }
    @supports (color: oklch(from red l c h)) {
      :root:not([data-theme="dark"]) {
        --l-d: oklch(from var(--l) min(l, .62) c h); --u-d: oklch(from var(--u) min(l, .62) c h);
        --k-d: oklch(from var(--k) min(l, .62) c h); --e-d: oklch(from var(--e) min(l, .62) c h);
      }
    }
    :root[data-theme="dark"] { --l-d: var(--l); --u-d: var(--u); --k-d: var(--k); --e-d: var(--e); }
    /* Text on the dark card: the plain colors are already light enough. */
    :root[data-theme="dark"] { --l-h: var(--l); --u-h: var(--u); --k-h: var(--k); --e-h: var(--e); }
    :root:not([data-theme="dark"]) { --l-h: var(--l-t); --u-h: var(--u-t); --k-h: var(--k-t); --e-h: var(--e-t); }
    #info {
      position: fixed; z-index: 2;
      left: calc(env(safe-area-inset-left) + 16px);
      bottom: calc(env(safe-area-inset-bottom) + 32px);
      width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%;
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,.85) 0 12%, rgba(255,255,255,0) 42%),
        conic-gradient(from 20deg, var(--l), var(--u), var(--k), var(--e), var(--l));
      box-shadow: 0 3px 8px rgba(0,0,0,.18), inset 0 -3px 6px rgba(0,0,0,.15);
      color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35);
      font: italic 700 18px/1 Georgia, "Times New Roman", serif;
      cursor: pointer; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      animation: bob 3s ease-in-out infinite;
      transition: transform .2s cubic-bezier(.3, 1.6, .5, 1);
    }
    #info:hover { animation-play-state: paused; transform: scale(1.12) rotate(-8deg); }
    #info:active { transform: scale(.88); }
    #info[aria-expanded="true"] { animation: none; transform: scale(1.05); }
    #info:focus-visible { outline: 2px dashed var(--ink); outline-offset: 3px; }

    /* A puff of front cloud (FooterPainter.frontColor) in front of the i, so it
       peeks out of the clouds like the swap balloon. */
    #info-puff {
      position: fixed; z-index: 3; pointer-events: none;
      left: calc(env(safe-area-inset-left) + 6px);
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      width: 56px; height: 20px; border-radius: 10px; background: var(--cloud);
    }
    #info-puff::before, #info-puff::after {
      content: ""; position: absolute; border-radius: 50%; background: var(--cloud);
    }
    #info-puff::before { width: 24px; height: 24px; left: 4px; top: -12px; }
    #info-puff::after { width: 26px; height: 26px; right: 2px; top: -13px; }
    #about {
      position: fixed; z-index: 3;
      left: calc(env(safe-area-inset-left) + 10px);
      bottom: calc(env(safe-area-inset-bottom) + 82px);
      box-sizing: border-box; width: min(310px, calc(100vw - 20px));
      padding: 16px 18px 14px; border-radius: 26px;
      /* candy-stripe border via two backgrounds */
      border: 3px solid transparent;
      background:
        linear-gradient(var(--card), var(--card)) padding-box,
        linear-gradient(120deg, var(--l), var(--u), var(--k), var(--e)) border-box;
      color: var(--ink);
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
      font: 14.5px/1.5 ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, sans-serif;
      -webkit-user-select: text; user-select: text; touch-action: auto;
      transform-origin: 24px calc(100% + 20px);
      animation: pop-in .45s cubic-bezier(.2, 1.5, .4, 1);
    }
    /* speech-bubble tail pointing at the i */
    #about::after {
      content: ""; position: absolute; left: 18px; bottom: -11px;
      width: 16px; height: 16px; transform: rotate(45deg);
      background: var(--card);
      /* --u: what the 120deg border gradient is at this spot */
      border-right: 3px solid var(--u); border-bottom: 3px solid var(--u);
      border-bottom-right-radius: 5px;
    }
    #about[hidden] { display: none; }
    #about:focus { outline: none; } /* focused programmatically on open */
    #about h2 {
      margin: 0 0 8px; font-size: 18px; font-weight: 800; letter-spacing: .5px;
    }
    #about h2 span { display: inline-block; animation: wiggle 2.4s ease-in-out infinite; }
    #about h2 span:nth-child(4n+1) { color: var(--l-d); }
    #about h2 span:nth-child(4n+2) { color: var(--u-d); }
    #about h2 span:nth-child(4n+3) { color: var(--k-d); }
    #about h2 span:nth-child(4n)   { color: var(--e-d); }
    #about h2 span:nth-child(2) { animation-delay: .15s; }
    #about h2 span:nth-child(3) { animation-delay: .3s; }
    #about h2 span:nth-child(4) { animation-delay: .45s; }
    #about h2 span:nth-child(5) { animation-delay: .6s; }
    #about h2 span:nth-child(6) { animation-delay: .75s; }
    #about h2 span:nth-child(7) { animation-delay: .9s; }
    #about .intro { margin: 0 0 10px; }
    #about ul { list-style: none; margin: 0; padding: 0; }
    #about li { position: relative; padding-left: 20px; margin: 0 0 7px; }
    /* tiny balloon bullets */
    #about li::before {
      content: ""; position: absolute; left: 2px; top: .38em;
      width: 10px; height: 12px; border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.8) 0 15%, transparent 45%), var(--c);
    }
    #about li:nth-child(1) { --c: var(--l); --c-h: var(--l-h); }
    #about li:nth-child(2) { --c: var(--k); --c-h: var(--k-h); }
    /* inline links: ink text, underline in the bullet's balloon color */
    #about li a {
      color: inherit; font-weight: 700;
      text-decoration: underline 2px var(--c); text-underline-offset: 3px;
    }
    #about li a:hover { color: var(--c-h); }
    /* Round icon buttons: quiet ink by default, filled with a balloon color
       (text-safe, so the white icon keeps 4.5:1) on hover/focus. */
    #about .links { margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
    #about .links a {
      position: relative; -webkit-tap-highlight-color: transparent;
      display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%;
      color: var(--ink); background: color-mix(in srgb, var(--ink) 8%, transparent);
      transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), background-color .2s, color .2s;
    }
    #about .links svg { width: 18px; height: 18px; display: block; }
    /* Material Symbols have built-in padding; size up to match the logos. */
    #about .links svg.m { width: 22px; height: 22px; }
    #about .links a:nth-child(1) { --c: var(--u-t); }  /* GitHub: indigo */
    #about .links a:nth-child(2) { --c: var(--e-t); }  /* LinkedIn: blue */
    #about .links a:nth-child(3) { --c: var(--l-t); }  /* email: red */
    #about .links a:nth-child(4) { --c: var(--k-t); }  /* grass: green */
    #about .links a:nth-child(5) { --c: var(--l2-t); } /* smoke: orange */
    #about .links a:nth-child(6) { --c: var(--e2-t); } /* flower: purple */
    /* Invisible 44x44 hit area (36 + 4px each side). With the 8px gap,
       neighbors' areas meet but don't overlap, and rows stay apart too. */
    #about .links a::after { content: ""; position: absolute; inset: -4px; }
    /* Touch: brief color on press; skip :hover so it doesn't stick after a tap. */
    @media (hover: none) {
      #about .links a:hover:not(:focus-visible):not(:active) { color: var(--ink); background: color-mix(in srgb, var(--ink) 8%, transparent); transform: none; }
    }
    #about .links a:hover, #about .links a:focus-visible {
      color: #fff; background: var(--c); transform: translateY(-2px) rotate(-6deg);
    }
    #about .links a:focus-visible { outline: 2px dashed var(--ink); outline-offset: 2px; }
    #about .links a:active { color: #fff; background: var(--c); transform: scale(.9); }
    #about .close {
      position: absolute; top: 8px; right: 10px;
      width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%;
      background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink);
      font: 700 16px/1 system-ui, sans-serif; cursor: pointer;
    }
    #about .close:hover { background: color-mix(in srgb, var(--ink) 16%, transparent); }

    @keyframes pop-in {
      0% { opacity: 0; transform: translateY(18px) scale(.3); }
      60% { opacity: 1; }
      100% { transform: none; }
    }
    @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -3px; } }
    @keyframes wiggle { 0%, 70%, 100% { transform: none; } 80% { transform: translateY(-3px) rotate(-6deg); } 90% { transform: translateY(0) rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) {
      #info, #about, #about h2 span, #sun::before, #sun::after, #moon::before { animation: none; }
      .sky, :root { transition: none; }
    }
  </style>
</head>
<body>
  <div id="footer-placeholder" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg"></svg></div>
  <script>
    // Same rows as FooterPainter._cloudRow with drift 0: a rect from `base`
    // down, plus a bump every `spacing` px whose size cycles through 5 steps.
    (() => {
      const box = document.getElementById('footer-placeholder');
      const svg = box.querySelector('svg');
      const H = 110, W = Math.max(screen.width, screen.height, innerWidth) + 100;
      const row = (base, radius, spacing, seed, fill) => {
        let d = `M0 ${base}H${W}V${H}H0Z`;
        for (let i = 0, x = -spacing; x < W + spacing; i++, x += spacing) {
          const r = radius * (0.8 + 0.1 * ((i + seed) % 5)), cy = base + r * 0.25;
          d += `M${x - r} ${cy}a${r} ${r} 0 1 1 ${2 * r} 0a${r} ${r} 0 1 1 ${-2 * r} 0Z`;
        }
        return `<path fill="${fill}" d="${d}"/>`;
      };
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.setAttribute('preserveAspectRatio', 'xMinYMax slice');
      svg.style.width = W + 'px';
      svg.innerHTML = row(H - 44, 26, 46, 0, 'var(--cloud-back)') + row(H - 30, 20, 34, 3, 'var(--cloud)');
      addEventListener('flutter-first-frame', () => box.remove(), { once: true });
    })();
  </script>
  <button id="sky-toggle" type="button" aria-label="Switch theme"></button>
  <div id="sun" class="sky" aria-hidden="true"></div>
  <div id="moon" class="sky" aria-hidden="true"></div>
  <div id="stage"></div>
  <button id="info" type="button" aria-label="About this page" aria-expanded="false" aria-controls="about">i</button>
  <div id="info-puff" aria-hidden="true"></div>
  <div id="about" role="dialog" aria-label="About" tabindex="-1" hidden>
    <button class="close" type="button" aria-label="Close">×</button>
    <h2 aria-label="Hello!"><span>H</span><span>e</span><span>l</span><span>l</span><span>o</span><span>!</span><span>🎈</span></h2>
    <p class="intro">I'm Luke. I write code and make&nbsp;noise.</p>
    <ul>
      <li>Tap a letter to make a sound, drag to bend, shake to wobble, hold it down to blow it up. Tap the little balloon to swap sets.</li>
      <li>Built with <a href="https://flutter.dev" target="_blank" rel="noopener">Flutter</a> web. Sounds synthesized in <a href="https://faust.grame.fr" target="_blank" rel="noopener">Faust</a>, compiled to Wasm.</li>
    </ul>

  <script>
    (() => {
      const btn = document.getElementById('info');
      const card = document.getElementById('about');
      const show = (open) => {
        card.hidden = !open;
        btn.setAttribute('aria-expanded', String(open));
        // Move focus into the dialog so screen readers land on it.
        if (open) card.focus({ preventScroll: true });
      };
      btn.addEventListener('click', () => show(card.hidden));
      card.querySelector('.close').addEventListener('click', () => { show(false); btn.focus(); });
      document.addEventListener('pointerdown', (e) => {
        if (!card.hidden && !card.contains(e.target) && !btn.contains(e.target)) show(false);
      }, true);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !card.hidden) { show(false); btn.focus(); }
      });
    })();
  </script>
